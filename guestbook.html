<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook - Sharan Senthil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;800&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top"></div>
<div class="page">
<main class="col">
<section class="win"><div class="bar"><span>guestbook.cgi</span></div><div class="in">
<figure class="pic" style="margin-bottom:1.2rem"><img src="img/sunrise-ht.png" alt="Halftone panel of a climber on a snowy ridge at sunrise" width="1080" height="773" style="max-height:13rem;object-fit:cover;object-position:50% 40%"><figcaption>summit register</figcaption></figure>
<h1>Guestbook</h1>
<p>Like the register at the top of a trail. Leave a name, a hello, or advice for someone who has never climbed.</p>
<div id="giscus-host"></div>
<p id="gb-setup" hidden>The guestbook isn't switched on yet. See README.md, "Turn on the guestbook".</p>
</div></section>
</main>
<aside id="side"></aside>
</div>
<footer id="foot"></footer>
<script>
/* Fill these in from https://giscus.app after you make your repo (see README.md). */
var GISCUS = { repo: "", repoId: "", category: "Guestbook", categoryId: "" };
(function () {
  var host = document.getElementById("giscus-host");
  if (!GISCUS.repo || !GISCUS.repoId || !GISCUS.categoryId) { document.getElementById("gb-setup").hidden = false; return; }
  var s = document.createElement("script");
  s.src = "https://giscus.app/client.js"; s.async = true; s.crossOrigin = "anonymous";
  var attrs = { "data-repo": GISCUS.repo, "data-repo-id": GISCUS.repoId, "data-category": GISCUS.category, "data-category-id": GISCUS.categoryId,
    "data-mapping": "specific", "data-term": "guestbook", "data-strict": "0", "data-reactions-enabled": "1",
    "data-emit-metadata": "0", "data-input-position": "top", "data-theme": "light", "data-lang": "en" };
  Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
  host.appendChild(s);
})();
</script>
<script src="site.js"></script>
</body>
</html>
